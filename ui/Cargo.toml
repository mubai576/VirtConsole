[package]
name = "vc-ui"
version = "0.1.0"
edition = "2021"
description = "VirtConsole Tauri 主界面（十英尺 UI：电视/PS5/Xbox 风格焦点导航）"

[lib]
name = "vc_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qmp-engine = { path = "../qmp-engine" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
portable-pty = "0.8"
zbus = { version = "5", features = ["tokio", "p2p"] }
libc = "0.2"
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
# dbus-display 采集仅 Linux 目标使用（zbus 已在通用依赖，这里仅为文档化）
gtk = "0.18"
glib = "0.18"
cairo-rs = "0.18"
gdkwayland-sys = "0.18"
