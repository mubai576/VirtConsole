<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtConsole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">VIRT<span>CONSOLE</span></div>
    <div class="crumb" id="crumb">首页 / 常用</div>
  </header>

  <main id="grid"></main>

  <footer class="statusbar">
    <span id="time">--:--</span>
    <span id="info">VirtConsole</span>
    <span class="hint">↑↓←→ 选择 · Enter 确认 · Esc 返回</span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
