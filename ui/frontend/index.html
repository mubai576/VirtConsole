<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtConsole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">VIRT<span>CONSOLE</span></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="topmeta">
      <span id="conn-status" class="conn" title="PVE 连接"></span>
      <span id="time" class="clock">--:--</span>
    </div>
  </header>

  <main id="content"></main>

  <!-- 沉浸层：VM 控制台 -->
  <section id="console-layer" class="console-layer hidden">
    <canvas id="vm-canvas"></canvas>
    <div class="console-hint">Ctrl+Alt+Q 返回 · 按键直接输入到虚拟机</div>
  </section>

  <footer class="statusbar">
    <span id="crumb">VirtConsole</span>
    <span id="info">就绪</span>
    <span class="hint" id="hint">↑↓←→ 选择 · Enter 确认 · Ctrl+Alt+Q 退出</span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
