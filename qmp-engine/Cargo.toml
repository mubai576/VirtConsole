[package]
name = "qmp-engine"
version = "0.1.0"
edition = "2021"
description = "QMP 引擎：QEMU 虚拟机管理协议客户端（状态、启停、键鼠投递、screendump）"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
